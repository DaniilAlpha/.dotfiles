<fontconfig>

	<!-- use `Inter` as a default `serif` and `sans-serif` font -->
	<match target="pattern">
		<test qual="any" name="family"><string>serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans-serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>Inter</string></edit>
	</match>

	<!-- use `JetBrains Mono NL` as a default `monospace` font -->
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<edit name="family" mode="assign" binding="same"><string>JetBrains Mono NL</string></edit>
	</match>

</fontconfig>
